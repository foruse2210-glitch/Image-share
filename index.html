<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
  box-sizing: border-box;
}

:root {
  --accent: #0a84ff;
  --accent-rgb: 10, 132, 255;
  --accent2: #0071e3;
  --accent2-rgb: 0, 113, 227;
}

:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --bg-rgb: 0, 0, 0;
  --fg-rgb: 255, 255, 255;
  --text: #ffffff;
  --muted: #86868b;
  --modal-bg: rgba(30, 30, 32, 0.85);
  --shadow-k: 1;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f7;
  --bg-rgb: 255, 255, 255;
  --fg-rgb: 0, 0, 0;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --modal-bg: rgba(255, 255, 255, 0.92);
  --shadow-k: 0.18;
}

:root[data-theme="midnight"] {
  color-scheme: dark;
  --bg: #0a1128;
  --bg-rgb: 10, 17, 40;
  --fg-rgb: 255, 255, 255;
  --text: #eaf0ff;
  --muted: #8a96b8;
  --modal-bg: rgba(18, 28, 60, 0.9);
  --shadow-k: 1;
}

:root[data-theme="warm"] {
  color-scheme: dark;
  --bg: #1a1410;
  --bg-rgb: 26, 20, 16;
  --fg-rgb: 255, 244, 230;
  --text: #f5ece0;
  --muted: #a39682;
  --modal-bg: rgba(44, 34, 27, 0.92);
  --shadow-k: 1;
}


body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
  transition: background 0.3s ease, color 0.3s ease;
}

header {
  padding: 40px 20px 24px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(var(--bg-rgb), 0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(var(--fg-rgb), 0.15);
}

h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}

.subtitle {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 15px;
  font-weight: 400;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 28px 16px;
}

/* Upload Drop Area - Rounded Glass Container */
#drop {
  display: block;
  border-radius: 20px;
  padding: 42px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  background: rgba(var(--fg-rgb), 0.03);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  box-shadow: inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
}

#drop:hover {
  background: rgba(var(--fg-rgb), 0.08);
  border-color: rgba(var(--fg-rgb), 0.45);
}

#drop strong {
  display: block;
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

#drop span {
  color: var(--muted);
  font-size: 14px;
}

#file {
  display: none;
}

/* Download protection (toggled from the admin dashboard) */
.no-download img {
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  user-select: none;
  -webkit-user-select: none;
}

.no-download .card img {
  pointer-events: none;
}

@media print {
  .no-download body { display: none !important; }
}

#drop.paused {
  opacity: 0.55;
  cursor: not-allowed;
  border-style: dashed;
}

#drop.paused:hover {
  background: rgba(var(--fg-rgb), 0.03);
  border-color: rgba(var(--fg-rgb), 0.2);
}

/* Progress Bar Styling */
.progress-container {
  display: none;
  width: 100%;
  max-width: 400px;
  height: 8px;
  background: rgba(var(--fg-rgb), 0.1);
  border-radius: 10px;
  margin: 18px auto 8px auto;
  overflow: hidden;
  border: 1px solid rgba(var(--fg-rgb), 0.15);
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 10px;
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.6);
}

#status {
  margin: 8px 0 18px 0;
  text-align: center;
  color: var(--muted);
  min-height: 20px;
  font-size: 14px;
  font-weight: 400;
  word-break: break-word;
}

/* Sticky Liquid Floating Toolbar */
.toolbar {
  position: sticky;
  top: 100px;
  z-index: 20;
  background: rgba(var(--bg-rgb), 0.65);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  padding: 12px 16px;
  border-radius: 24px;
  border: 1px solid rgba(var(--fg-rgb), 0.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, calc(0.5 * var(--shadow-k)));
}

.toolbar-left {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* Selected Counter Badge */
.selected-count {
  display: none;
  font-size: 14px;
  font-weight: 500;
  color: var(--accent);
  background: rgba(var(--accent-rgb), 0.15);
  border: 1px solid rgba(var(--accent-rgb), 0.3);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}

/* Base Rounded Glass Button */
.btn-round {
  height: 44px;
  border-radius: 22px;
  background: rgba(var(--fg-rgb), 0.06);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  box-shadow: inset 0 1px 1px rgba(var(--fg-rgb), 0.25);
  outline: none !important;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-round:hover:not(:disabled) {
  background: rgba(var(--fg-rgb), 0.15);
  border-color: rgba(var(--fg-rgb), 0.45);
  transform: translateY(-2px);
}

.btn-round:active {
  transform: scale(0.96) !important;
}

.btn-icon-only {
  width: 44px;
}

/* Keyframe Animations for Password Gear Icon */
@keyframes gearSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulseGlow {
  0% { box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3); }
  50% { box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.7); }
  100% { box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3); }
}

/* Enhanced Change Password Button */
.btn-password-change {
  padding: 0 18px 0 14px;
  gap: 8px;
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.25), rgba(var(--accent2-rgb), 0.15));
  border: 1px solid rgba(var(--accent-rgb), 0.4);
  animation: pulseGlow 3s infinite ease-in-out;
}

.btn-password-change:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.45), rgba(var(--accent2-rgb), 0.35));
  border-color: rgba(var(--accent-rgb), 0.7);
  box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.5);
}

.btn-password-change svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.btn-password-change:hover svg {
  animation: gearSpin 1.8s linear infinite;
}

/* Select Button */
.btn-round-select {
  color: var(--text);
}

.btn-round-select.active {
  background: rgba(var(--accent2-rgb), 0.9);
  border-color: rgba(var(--fg-rgb), 0.5);
  color: #fff;
  box-shadow: 0 0 20px rgba(var(--accent2-rgb), 0.6) !important;
}

.btn-round-select svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-round-select.active svg {
  transform: rotate(360deg);
}

/* Delete Button */
.btn-round-delete {
  color: #ff453a;
  background: rgba(255, 69, 58, 0.12);
  border-color: rgba(255, 69, 58, 0.3);
}

.btn-round-delete:hover:not(:disabled) {
  background: rgba(255, 69, 58, 0.25);
  border-color: rgba(255, 69, 58, 0.5);
  box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
}

.btn-round-delete:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.btn-round-delete svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Shake Animation */
@keyframes shakeTrash {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(-10deg); }
  40% { transform: rotate(10deg); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
  100% { transform: rotate(0deg); }
}

.btn-round-delete.deleting {
  animation: shakeTrash 0.5s ease-in-out infinite;
  background: rgba(255, 69, 58, 0.9) !important;
  color: #fff !important;
}

/* Masonry Grid & Cards */
.grid {
  columns: 4 220px;
  column-gap: 18px;
}

.card {
  break-inside: avoid;
  margin: 0 0 18px;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(var(--fg-rgb), 0.04);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(var(--fg-rgb), 0.18);
  box-shadow: 0 10px 30px rgba(0, 0, 0, calc(0.8 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
  cursor: pointer;
  user-select: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(var(--fg-rgb), 0.4);
  box-shadow: 0 16px 40px rgba(0, 0, 0, calc(0.9 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.35);
}

.card img {
  display: block;
  width: 100%;
  height: auto;
  transition: opacity 0.3s ease;
}

.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent), 0 12px 36px rgba(var(--accent-rgb), 0.45);
}

.card.deleting-card {
  opacity: 0;
  transform: scale(0.9);
}

/* Custom Checkbox Overlay */
.select-box {
  display: none;
  position: absolute;
  top: 12px;
  left: 12px;
  width: 22px;
  height: 22px;
  z-index: 5;
  cursor: pointer;
  accent-color: var(--accent);
  outline: none;
  border-radius: 4px;
}

.selecting .select-box {
  display: block;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 60px 10px;
  font-size: 15px;
}

/* Lightbox Glass Overlay & Navigation Arrows */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 88vw;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.2);
}

.close {
  position: absolute;
  right: 24px;
  top: 20px;
  font-size: 28px;
  color: #ffffff;
  cursor: pointer;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  transition: all 0.2s ease;
  z-index: 102;
}

.close:hover {
  background: rgba(255, 255, 255, 0.2);
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 50px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.2s ease;
  z-index: 101;
  user-select: none;
}

.lightbox-arrow:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: translateY(-50%) scale(1.08);
}

.lightbox-arrow svg {
  width: 28px;
  height: 28px;
  fill: currentColor;
}

.lightbox-prev {
  left: 20px;
}

.lightbox-next {
  right: 20px;
}

/* Glass Modals */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(var(--bg-rgb), 0.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  z-index: 105;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: var(--modal-bg);
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, calc(0.8 * var(--shadow-k))), inset 0 1px 1px rgba(var(--fg-rgb), 0.2);
}

.modal-content h3 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
}

.modal-content p {
  margin: 0 0 20px;
  font-size: 14px;
  color: var(--muted);
}

/* Input Wrappers with Password Toggle Eye Button */
.input-field-group {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
}

.input-field-group input {
  width: 100%;
  padding: 12px 42px 12px 16px;
  border-radius: 12px;
  border: 1px solid rgba(var(--fg-rgb), 0.2);
  background: rgba(var(--bg-rgb), 0.5);
  color: var(--text);
  font-size: 16px;
  outline: none;
  text-align: left;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input-field-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3);
}

.toggle-eye-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: color 0.2s ease;
}

.toggle-eye-btn:hover {
  color: var(--text);
}

.toggle-eye-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

.modal-btn-cancel {
  background: rgba(var(--fg-rgb), 0.1);
  color: var(--text);
}

.modal-btn-cancel:hover {
  background: rgba(var(--fg-rgb), 0.2);
}

.modal-btn-confirm {
  background: #ff453a;
  color: #fff;
}

.modal-btn-confirm:hover {
  background: #ff6961;
}

.modal-btn-primary {
  background: var(--accent);
  color: #fff;
}

.modal-btn-primary:hover {
  background: var(--accent2);
}


@media(max-width: 650px) {
  h1 { font-size: 28px; }
  .grid { columns: 2 150px; }
  .btn-password-change span { display: none; }
  .btn-password-change { padding: 0 12px; }
  .toolbar { top: 90px; }
  .lightbox-prev { left: 10px; }
  .lightbox-next { right: 10px; }
  .lightbox-arrow { width: 40px; height: 40px; }
  .lightbox-arrow svg { width: 22px; height: 22px; }
}
</style>
<script>
window.APPEARANCE = (function(){
  var THEMES = {
    auto:     {name:'Auto',     bg:'linear-gradient(90deg,#000 50%,#f5f5f7 50%)'},
    dark:     {name:'Dark',     bg:'#000000'},
    light:    {name:'Light',    bg:'#f5f5f7'},
    midnight: {name:'Midnight', bg:'#0a1128'},
    warm:     {name:'Warm',     bg:'#1a1410'}
  };
  var ACCENTS = [
    {name:'Blue',   hex:'#0a84ff'},
    {name:'Purple', hex:'#bf5af2'},
    {name:'Pink',   hex:'#ff375f'},
    {name:'Orange', hex:'#ff9f0a'},
    {name:'Green',  hex:'#30d158'},
    {name:'Teal',   hex:'#40c8e0'}
  ];
  var DEFAULTS = {theme:'dark', accent:'#0a84ff'};
  function read(k, d){ try { return localStorage.getItem(k) || d; } catch(e){ return d; } }
  function write(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function hexToRgb(h){
    h = String(h).replace('#','');
    if (h.length === 3) h = h.split('').map(function(c){return c+c;}).join('');
    var n = parseInt(h, 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function get(){
    var t = read('app_theme', DEFAULTS.theme);
    var a = read('app_accent', DEFAULTS.accent);
    if (!THEMES[t]) t = DEFAULTS.theme;
    if (!/^#[0-9a-fA-F]{6}$/.test(a)) a = DEFAULTS.accent;
    return {theme:t, accent:a};
  }
  function apply(theme, accent, save){
    var root = document.documentElement;
    var resolved = theme;
    if (theme === 'auto') {
      resolved = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    root.setAttribute('data-theme', resolved);
    var rgb = hexToRgb(accent);
    var rgb2 = rgb.map(function(v){ return Math.round(v*0.85); });
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-rgb', rgb.join(', '));
    root.style.setProperty('--accent2', 'rgb(' + rgb2.join(',') + ')');
    root.style.setProperty('--accent2-rgb', rgb2.join(', '));
    if (save) { write('app_theme', theme); write('app_accent', accent); }
  }
  var cur = get();
  apply(cur.theme, cur.accent, false);
  return {themes:THEMES, accents:ACCENTS, defaults:DEFAULTS, get:get, apply:apply};
})();
</script>
</head>
<body>
<header>
  <h1>PHOTOS</h1>
  <div class="subtitle">Anyone can upload photos in this.</div>
</header>

<main>
  <label id="drop" for="file" tabindex="0">
    <strong>Upload image</strong>
    <span>photo ivide upload aakuka!</span>
    <input id="file" type="file" accept="image/*" multiple>
  </label>

  <div id="progressContainer" class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div id="status">wait aakk photos ippo varum... </div>

  <!-- Action Bar for Selection & Deletion -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="toggleSelectBtn" class="btn-round btn-icon-only btn-round-select" type="button" title="Select Photos">
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </button>
      <span id="selectedCount" class="selected-count">0 selected</span>
    </div>
    <button id="deleteSelectedBtn" class="btn-round btn-icon-only btn-round-delete" type="button" style="display:none;" title="Delete Selected" disabled>
      <svg viewBox="0 0 24 24">
        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
      </svg>
    </button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">No photos yet. Be the first to add one.</div>
  <div id="hiddenNotice" class="empty" style="display:none">Photos are hidden for now.</div>
</main>

<div id="lightbox" class="lightbox">
  <div class="close" id="close">&times;</div>
  <div class="lightbox-arrow lightbox-prev" id="prevBtn" title="Previous photo">
    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
  </div>
  <img id="lightboxImg" alt="">
  <div class="lightbox-arrow lightbox-next" id="nextBtn" title="Next photo">
    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
  </div>

<script>
const SUPABASE_URL = 'https://wykfkkleyhrdeimkirxv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_h-O7O9zu3i9PyXY99g1H5g_9gDIKTA2';

// SVG Paths for Eye Icons
const EYE_OPEN_PATH = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';

// The delete password is managed from the admin dashboard (stored in Supabase).
// Falls back to '123' if it has not been set or cannot be loaded.
async function getDeletePassword(){
  try {
    const { data, error } = await supabaseClient
      .from('site_appearance')
      .select('value')
      .eq('key', 'delete_password')
      .maybeSingle();
    if (!error && data && data.value) return String(data.value);
  } catch (e) { console.error('Password fetch failed', e); }
  return '123';
}

const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const fileIn = document.getElementById('file');
const drop = document.getElementById('drop');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');

const toggleSelectBtn = document.getElementById('toggleSelectBtn');
const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
const selectedCountEl = document.getElementById('selectedCount');

// Delete Password Modal Elements
const passwordModal = document.getElementById('passwordModal');
const deletePasswordInput = document.getElementById('deletePasswordInput');
const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

// Lightbox Navigation Elements
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let supabaseClient = null;
let isSelectMode = false;
let selectedPhotoIds = new Set();
let currentPhotos = [];
let currentLightboxIndex = -1;

function say(message){
  statusEl.textContent = message;
}

// Tracks which file of a multi-file upload is in progress
let batch = { index: 0, total: 1 };
let isUploading = false;
const MAX_UPLOAD_BATCH = 10; // max photos per multi-select upload

function setProgress(percent) {
  if (percent <= 0) {
    progressContainer.style.display = 'none';
    progressBar.style.width = '0%';
  } else {
    progressContainer.style.display = 'block';
    const overall = ((batch.index + Math.min(percent, 100) / 100) / batch.total) * 100;
    progressBar.style.width = Math.min(overall, 100) + '%';
  }
}

try {
  if (!window.supabase || !window.supabase.createClient) {
    throw new Error('Supabase JavaScript library did not load.');
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(err) {
  console.error(err);
  say('SUPABASE INIT ERROR: ' + (err.message || err));
}

function showError(prefix, err){
  console.error(prefix, err);
  const parts = [
    err?.code,
    err?.message || String(err),
    err?.details,
    err?.hint
  ].filter(Boolean);
  say(prefix + ': ' + parts.join(' | '));
}

// Attach toggle password visibility functionality
document.querySelectorAll('.toggle-eye-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const targetId = btn.getAttribute('data-target');
    const input = document.getElementById(targetId);
    const svg = btn.querySelector('svg');
    if (input.type === 'password') {
      input.type = 'text';
      svg.innerHTML = EYE_CLOSED_PATH;
    } else {
      input.type = 'password';
      svg.innerHTML = EYE_OPEN_PATH;
    }
  });
});

async function loadPhotos(){
  if(!supabaseClient) return;

  if(downloadsPaused){
    currentPhotos = [];
    renderGrid();
    return;
  }

  const {data, error} = await supabaseClient
    .from('photos')
    .select('id,data,name,created_at')
    .order('created_at', {ascending:false});

  if(error){
    showError('LOAD ERROR', error);
    return;
  }

  currentPhotos = data || [];
  renderGrid();
}

function renderGrid(){
  grid.innerHTML = '';

  const hiddenNotice = document.getElementById('hiddenNotice');
  if(downloadsPaused){
    isSelectMode = false;
    selectedPhotoIds.clear();
    grid.classList.remove('selecting');
    empty.style.display = 'none';
    hiddenNotice.style.display = 'block';
    toggleSelectBtn.style.display = 'none';
    deleteSelectedBtn.style.display = 'none';
    selectedCountEl.style.display = 'none';
    lightbox.classList.remove('open');
    lightboxImg.removeAttribute('src');
    say('Photos are hidden.');
    return;
  }
  hiddenNotice.style.display = 'none';

  if(!currentPhotos || currentPhotos.length === 0){
    empty.style.display = 'block';
    toggleSelectBtn.style.display = 'none';
    deleteSelectedBtn.style.display = 'none';
    selectedCountEl.style.display = 'none';
    say('Connected. No photos yet.');
    return;
  }

  empty.style.display = 'none';
  toggleSelectBtn.style.display = 'inline-flex';
  say(currentPhotos.length + (currentPhotos.length === 1 ? ' photo' : ' photos') + ' loaded.');

  if(isSelectMode){
    grid.classList.add('selecting');
    deleteSelectedBtn.style.display = 'inline-flex';
    selectedCountEl.style.display = 'inline-block';
    toggleSelectBtn.classList.add('active');
    toggleSelectBtn.title = 'Cancel Selection';
  } else {
    grid.classList.remove('selecting');
    deleteSelectedBtn.style.display = 'none';
    selectedCountEl.style.display = 'none';
    toggleSelectBtn.classList.remove('active');
    toggleSelectBtn.title = 'Select Photos';
  }

  currentPhotos.forEach((photo, index) => {
    const card = document.createElement('div');
    card.className = 'card' + (selectedPhotoIds.has(photo.id) ? ' selected' : '');
    card.dataset.id = photo.id;

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'select-box';
    checkbox.checked = selectedPhotoIds.has(photo.id);

    const img = document.createElement('img');
    img.src = photo.data;
    img.alt = photo.name || 'Photo';
    img.loading = 'lazy';

    const toggleSelection = (e) => {
      e.stopPropagation();
      if(selectedPhotoIds.has(photo.id)){
        selectedPhotoIds.delete(photo.id);
        card.classList.remove('selected');
        checkbox.checked = false;
      } else {
        selectedPhotoIds.add(photo.id);
        card.classList.add('selected');
        checkbox.checked = true;
      }
      updateDeleteButton();
    };

    checkbox.addEventListener('click', (e) => {
      e.stopPropagation();
      if(checkbox.checked){
        selectedPhotoIds.add(photo.id);
        card.classList.add('selected');
      } else {
        selectedPhotoIds.delete(photo.id);
        card.classList.remove('selected');
      }
      updateDeleteButton();
    });

    card.addEventListener('click', (e) => {
      if(isSelectMode){
        toggleSelection(e);
      } else {
        openLightbox(index);
      }
    });

    card.appendChild(checkbox);
    card.appendChild(img);
    grid.appendChild(card);
  });

  updateDeleteButton();
}

/* Lightbox Navigation Functions */
function openLightbox(index) {
  if (index < 0 || index >= currentPhotos.length) return;
  currentLightboxIndex = index;
  lightboxImg.src = currentPhotos[currentLightboxIndex].data;
  lightbox.classList.add('open');
}

function showPrevPhoto() {
  if (currentPhotos.length === 0) return;
  currentLightboxIndex = (currentLightboxIndex - 1 + currentPhotos.length) % currentPhotos.length;
  lightboxImg.src = currentPhotos[currentLightboxIndex].data;
}

function showNextPhoto() {
  if (currentPhotos.length === 0) return;
  currentLightboxIndex = (currentLightboxIndex + 1) % currentPhotos.length;
  lightboxImg.src = currentPhotos[currentLightboxIndex].data;
}

prevBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  showPrevPhoto();
});

nextBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  showNextPhoto();
});

document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') showPrevPhoto();
  if (e.key === 'ArrowRight') showNextPhoto();
  if (e.key === 'Escape') lightbox.classList.remove('open');
});

function updateDeleteButton(){
  const count = selectedPhotoIds.size;
  deleteSelectedBtn.title = `Delete ${count} selected photo(s)`;
  deleteSelectedBtn.disabled = count === 0;
  selectedCountEl.textContent = `${count} selected`;
}

toggleSelectBtn.addEventListener('click', () => {
  isSelectMode = !isSelectMode;
  if(!isSelectMode){
    selectedPhotoIds.clear();
  }
  renderGrid();
});

/* Open Password Modal for Delete */
deleteSelectedBtn.addEventListener('click', () => {
  if(selectedPhotoIds.size === 0) return;
  deletePasswordInput.value = '';
  passwordModal.classList.add('open');
  deletePasswordInput.focus();
});

cancelDeleteBtn.addEventListener('click', () => {
  passwordModal.classList.remove('open');
});

deletePasswordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    confirmDeleteBtn.click();
  }
});

/* Process Deletion after Password Check */
confirmDeleteBtn.addEventListener('click', async () => {
  const enteredPassword = deletePasswordInput.value;
  const currentPassword = await getDeletePassword();
  if (enteredPassword !== currentPassword) {
    alert('Incorrect password! Deletion canceled.');
    deletePasswordInput.value = '';
    deletePasswordInput.focus();
    return;
  }

  passwordModal.classList.remove('open');

  deleteSelectedBtn.classList.add('deleting');
  deleteSelectedBtn.disabled = true;

  const idsToDelete = Array.from(selectedPhotoIds);

  idsToDelete.forEach(id => {
    const cardEl = grid.querySelector(`.card[data-id="${id}"]`);
    if(cardEl) cardEl.classList.add('deleting-card');
  });

  say('Deleting selected photos...');

  const {error} = await supabaseClient
    .from('photos')
    .delete()
    .in('id', idsToDelete);

  setTimeout(async () => {
    deleteSelectedBtn.classList.remove('deleting');
    if(error){
      showError('DELETE ERROR', error);
      updateDeleteButton();
      return;
    }

    selectedPhotoIds.clear();
    isSelectMode = false;
    await loadPhotos();
  }, 400);
});

function resizeImage(file, maxSize=1600, quality=.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    
    reader.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 40);
        setProgress(percent);
      }
    };

    reader.onload = () => {
      setProgress(50);
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          const scale = Math.min(maxSize/w, maxSize/h);
          w = Math.round(w*scale);
          h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        setProgress(70);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => {
        setProgress(0);
        reject(new Error('Could not read the image.'));
      };
      img.src = reader.result;
    };
    reader.onerror = () => {
      setProgress(0);
      reject(new Error('Could not read the selected file.'));
    };
    reader.readAsDataURL(file);
  });
}

async function addPhotos(fileList){
  const files = Array.from(fileList || []);
  if(files.length === 0) return;

  if(!supabaseClient){
    say('Supabase is not initialized.');
    return;
  }

  if(isUploading){
    say('An upload is already in progress. Please wait.');
    return;
  }

  await syncUploadState();
  if(uploadsPaused){
    say('Uploads are currently paused.');
    return;
  }

  const images = files.filter(f => f && f.type && f.type.startsWith('image/'));
  if(images.length === 0){
    say('Please select an image.');
    return;
  }
  const skipped = files.length - images.length;

  let overLimit = 0;
  if(images.length > MAX_UPLOAD_BATCH){
    overLimit = images.length - MAX_UPLOAD_BATCH;
    images.length = MAX_UPLOAD_BATCH;
  }

  isUploading = true;
  let uploaded = 0;
  const failed = [];
  let stopped = false;

  try{
    for(let i = 0; i < images.length; i++){
      if(uploadsPaused){ stopped = true; break; }

      batch = { index: i, total: images.length };
      const file = images[i];
      say(images.length > 1 ? `Uploading ${i + 1} of ${images.length}...` : 'Uploading...');
      setProgress(10);

      try{
        const data = await resizeImage(file);
        setProgress(85);

        const {error} = await supabaseClient
          .from('photos')
          .insert({
            data:data,
            name:file.name
          });

        if(error) throw error;
        setProgress(100);
        uploaded++;
      }catch(err){
        console.error('UPLOAD ERROR', file.name, err);
        failed.push(file.name || 'photo');
      }
    }
  } finally {
    isUploading = false;
    batch = { index: 0, total: 1 };
  }

  setTimeout(() => setProgress(0), 1000);
  await loadPhotos();

  let msg = uploaded + (uploaded === 1 ? ' photo' : ' photos') + ' uploaded successfully.';
  if(images.length > 1) msg = uploaded + ' of ' + images.length + ' photos uploaded.';
  if(failed.length) msg += ' Failed: ' + failed.join(', ') + '.';
  if(stopped) msg += ' Uploads were paused, so the rest were skipped.';
  if(overLimit) msg += ' Limit is ' + MAX_UPLOAD_BATCH + ' photos at a time, so ' + overLimit + ' extra ' + (overLimit === 1 ? 'photo was' : 'photos were') + ' not uploaded.';
  if(skipped) msg += ' ' + skipped + ' non-image file' + (skipped === 1 ? '' : 's') + ' skipped.';
  say(msg);
}

fileIn.addEventListener('change', () => {
  const files = Array.from(fileIn.files || []);
  fileIn.value = '';
  if(files.length > MAX_UPLOAD_BATCH){
    alert('You can select a maximum of ' + MAX_UPLOAD_BATCH + ' photos at a time. Only the first ' + MAX_UPLOAD_BATCH + ' will be uploaded.');
  }
  if(files.length) addPhotos(files);
});

drop.addEventListener('dragover', e => {

drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.style.borderColor = '';
  const files = e.dataTransfer.files;
  if(files && files.length > MAX_UPLOAD_BATCH){
    alert('You can select a maximum of ' + MAX_UPLOAD_BATCH + ' photos at a time. Only the first ' + MAX_UPLOAD_BATCH + ' will be uploaded.');
  }
  if(files && files.length) addPhotos(files);
});

document.getElementById('close').addEventListener('click', () => {

lightbox.addEventListener('click', e => {

/* Appearance: theme & accent are controlled from the admin dashboard */
(function(){
  const A = window.APPEARANCE;

  async function syncAppearance(){
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient
        .from('site_appearance')
        .select('value')
        .eq('key', 'appearance')
        .maybeSingle();
      if (error || !data || !data.value) return;
      const v = typeof data.value === 'string' ? JSON.parse(data.value) : data.value;
      if (!v || !A.themes[v.theme] || !/^#[0-9a-fA-F]{6}$/.test(v.accent || '')) return;
      const cur = A.get();
      if (cur.theme !== v.theme || cur.accent.toLowerCase() !== v.accent.toLowerCase()) {
        A.apply(v.theme, v.accent, true);
      }
    } catch (e) { console.error('Appearance sync failed', e); }
  }

  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: light)');
    const onChange = () => { const c = A.get(); if (c.theme === 'auto') A.apply(c.theme, c.accent, false); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  syncAppearance();
  setInterval(syncAppearance, 5000);
})();

/* Upload pause/resume is controlled from the admin dashboard */
let uploadsPaused = false;
const dropTitleEl = drop.querySelector('strong');
const dropHintEl = drop.querySelector('span');
const dropTitleText = dropTitleEl.textContent;
const dropHintText = dropHintEl.textContent;

function applyUploadState(){
  drop.classList.toggle('paused', uploadsPaused);
  fileIn.disabled = uploadsPaused;
  dropTitleEl.textContent = uploadsPaused ? 'Uploads paused' : dropTitleText;
  dropHintEl.textContent = uploadsPaused ? 'Uploading is turned off for now. Please check back later.' : dropHintText;
}

let downloadsPaused = false;
try { downloadsPaused = localStorage.getItem('app_downloads_paused') === 'true'; } catch (e) {}

function applyDownloadState(){
  document.documentElement.classList.toggle('no-download', downloadsPaused);
  lightboxImg.draggable = !downloadsPaused;
}

async function syncUploadState(){
  if(!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('site_appearance')
      .select('key,value')
      .in('key', ['uploads_paused', 'downloads_paused']);
    if (error) return;
    const map = {};
    (data || []).forEach(r => { map[r.key] = String(r.value); });
    uploadsPaused = map.uploads_paused === 'true';
    const wasPaused = downloadsPaused;
    downloadsPaused = map.downloads_paused === 'true';
    try { localStorage.setItem('app_downloads_paused', String(downloadsPaused)); } catch (e) {}
    applyUploadState();
    applyDownloadState();
    if (wasPaused !== downloadsPaused) loadPhotos();
  } catch (e) { console.error('Upload/download state sync failed', e); }
}

/* Block the usual ways of saving images while downloads are paused */
document.addEventListener('contextmenu', (e) => {
  if (!downloadsPaused) return;
  if (e.target.closest && e.target.closest('.card, .lightbox, img')) e.preventDefault();
});

document.addEventListener('dragstart', (e) => {
  if (downloadsPaused && e.target.tagName === 'IMG') e.preventDefault();
});

document.addEventListener('keydown', (e) => {
  if (!downloadsPaused) return;
  const k = (e.key || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p')) e.preventDefault();
});

drop.addEventListener('click', (e) => {
  if (uploadsPaused) e.preventDefault();
});

applyDownloadState();
syncUploadState();
setInterval(syncUploadState, 5000);

loadPhotos();
setInterval(loadPhotos, 5000);
</script>
