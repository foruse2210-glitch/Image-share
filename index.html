<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Wall</title>

<style>
:root{
  --bg:#050505;
  --card:#111111;
  --text:#f5f5f5;
  --muted:#999;
  --silver:#d0d0d0;
  --line:#363636;
}

*{box-sizing:border-box}

html{
  background:#050505;
  scroll-padding-top:env(safe-area-inset-top,0px);
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#242424 0%,#0b0b0b 38%,#050505 75%);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
}

main{
  max-width:1000px;
  margin:0 auto;
  padding:32px 16px 55px;
}

h1{
  margin:0 0 5px;
  font-size:2.4rem;
  letter-spacing:-.02em;
  background:linear-gradient(135deg,#fff,#888,#fff,#666,#eee);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

p.sub{
  margin:0 0 22px;
  color:var(--muted);
  font-family:system-ui,sans-serif;
  font-size:.95rem;
}

#drop{
  border:2px dashed #555;
  border-radius:16px;
  padding:30px;
  text-align:center;
  background:linear-gradient(145deg,#171717,#0b0b0b);
  cursor:pointer;
  font-family:system-ui,sans-serif;
  color:#999;
  transition:.2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),
             0 12px 35px rgba(0,0,0,.45);
}

#drop:hover,#drop.over{
  border-color:#d0d0d0;
  color:#d0d0d0;
  background:linear-gradient(145deg,#202020,#0c0c0c);
  box-shadow:0 0 25px rgba(255,255,255,.07),
             inset 0 1px 0 rgba(255,255,255,.08);
}

#drop b{
  display:block;
  font-size:1.08rem;
  color:#eee;
  margin-bottom:5px;
}

#status{
  min-height:1.4em;
  margin:12px 0;
  font:.9rem system-ui,sans-serif;
  color:#999;
  text-align:center;
}

#grid{
  columns:3 220px;
  column-gap:15px;
  margin-top:8px;
}

.item{
  break-inside:avoid;
  margin:0 0 15px;
  background:linear-gradient(145deg,#171717,#0d0d0d);
  border:1px solid #383838;
  border-radius:13px;
  overflow:hidden;
  position:relative;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
  transition:.2s;
}

.item:hover{
  border-color:#777;
  transform:translateY(-2px);
  box-shadow:0 15px 35px rgba(0,0,0,.6);
}

.item img{
  display:block;
  width:100%;
  height:auto;
  cursor:zoom-in;
}

.item button{
  position:absolute;
  top:9px;
  right:9px;
  border:1px solid #666;
  border-radius:999px;
  background:rgba(0,0,0,.78);
  color:#ddd;
  font:600 .8rem system-ui,sans-serif;
  padding:6px 12px;
  cursor:pointer;
  transition:.2s;
}

.item button:hover{
  background:#d5d5d5;
  color:#050505;
  border-color:#fff;
}

#empty{
  text-align:center;
  color:#777;
  font-family:system-ui,sans-serif;
  padding:50px 0;
}

#lb{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
  backdrop-filter:blur(8px);
}

#lb.on{display:flex}

#lb img{
  max-width:100%;
  max-height:100%;
  border-radius:9px;
  box-shadow:0 0 50px rgba(255,255,255,.08);
}

@media(max-width:600px){
  main{padding:25px 12px 40px}
  h1{font-size:2rem}
  #drop{padding:24px 15px}
  #grid{columns:2 150px;column-gap:10px}
  .item{margin-bottom:10px}
}
</style>
</head>

<body>
<main>
  <h1>Photo Wall</h1>
  <p class="sub">Add photos, remove them, and everyone sees the same wall.</p>

  <div id="drop" tabindex="0">
    <b>Tap to upload or drop images here</b>
    JPG, PNG, GIF, WebP · multiple allowed
  </div>

  <input id="file" type="file" accept="image/*" multiple hidden>

  <div id="status"></div>
  <div id="grid"></div>

  <div id="empty">
    No photos yet. Be the first to add one.
  </div>
</main>

<div id="lb">
  <img alt="">
</div>

<script>
const drop=document.querySelector('#drop');
const fileIn=document.querySelector('#file');
const grid=document.querySelector('#grid');
const empty=document.querySelector('#empty');
const statusEl=document.querySelector('#status');

function say(text=''){
  statusEl.textContent=text;
}

drop.onclick=()=>fileIn.click();

drop.onkeydown=e=>{
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    fileIn.click();
  }
};

fileIn.onchange=()=>{
  addPhotos([...fileIn.files]);
  fileIn.value='';
};

['dragover','dragenter'].forEach(ev=>{
  drop.addEventListener(ev,e=>{
    e.preventDefault();
    drop.classList.add('over');
  });
});

['dragleave','drop'].forEach(ev=>{
  drop.addEventListener(ev,e=>{
    e.preventDefault();
    drop.classList.remove('over');
  });
});

drop.addEventListener('drop',e=>{
  addPhotos([...e.dataTransfer.files]);
});

function addPhotos(files){
  const images=files.filter(f=>f.type.startsWith('image/'));

  if(!images.length){
    say('Please select image files.');
    return;
  }

  say(`Adding ${images.length} photo${images.length===1?'':'s'}...`);

  images.forEach(file=>{
    const reader=new FileReader();

    reader.onload=e=>{
      createPhoto(e.target.result,file.name);
    };

    reader.readAsDataURL(file);
  });

  setTimeout(()=>say(''),1500);
}

function createPhoto(src,name){
  empty.style.display='none';

  const box=document.createElement('div');
  box.className='item';

  const img=document.createElement('img');
  img.src=src;
  img.alt=name||'photo';
  img.loading='lazy';

  img.onclick=()=>{
    document.querySelector('#lb img').src=src;
    document.querySelector('#lb').classList.add('on');
  };

  const button=document.createElement('button');
  button.textContent='Delete';

  button.onclick=e=>{
    e.stopPropagation();

    if(confirm('Delete this photo?')){
      box.remove();

      if(!grid.children.length){
        empty.style.display='block';
      }
    }
  };

  box.append(img,button);
  grid.prepend(box);
}

document.querySelector('#lb').onclick=()=>{
  document.querySelector('#lb').classList.remove('on');
};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    document.querySelector('#lb').classList.remove('on');
  }
});
</script>

</body>
</html>
